name: Apply Auto Boxing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-auto-boxing.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch AseholeHub.lua
        shell: python
        run: |
          from pathlib import Path
          import base64

          path = Path("AseholeHub.lua")
          source = path.read_text(encoding="utf-8")

          pairs = [
              (
                  "",
                  ""
              ),
              (
                  "LS0gQXV0byBCdXkgQm94aW5nIEdsb3Zlcwpsb2NhbCBhdXRvQnV5Qm94aW5nR2xvdmVzRW5hYmxlZCA9IGZhbHNlCmxvY2FsIGF1dG9CdXlCb3hpbmdHbG92ZXNUaHJlYWQgPSBuaWwK",
                  "LS0gQXV0byBCb3hpbmcKbG9jYWwgYXV0b0JveGluZ0VuYWJsZWQgPSBmYWxzZQpsb2NhbCBhdXRvQm94aW5nVGhyZWFkID0gbmlsCmxvY2FsIGF1dG9Cb3hpbmdNMVB1bHNlID0gQVVUT19CT1hJTkdfREVGQVVMVF9NMV9QVUxTRQpsb2NhbCBhdXRvQm94aW5nTTFTdGF0ZSA9IG5pbAo="
              ),
              (
                  "",
                  ""
              ),
              (
                  "",
                  ""
              ),
          ]

          for index, (old_b64, new_b64) in enumerate(pairs, 1):
              old = base64.b64decode(old_b64).decode("utf-8")
              new = base64.b64decode(new_b64).decode("utf-8")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"replacement {index} expected once, found {count}")
              source = source.replace(old, new, 1)

          path.write_text(source, encoding="utf-8")

      - name: Verify patch structure
        shell: python
        run: |
          from pathlib import Path
          source = Path("AseholeHub.lua").read_text(encoding="utf-8")
          required = [
              'local HUB_VERSION = "1.3.8"',
              'Name = "Auto Boxing"',
              'Flag = "AutoBoxing"',
              'Name = "M1 Pulse"',
              'Flag = "AutoBoxingM1Pulse"',
              'local function findGameM1State',
              'getconnections(mouse.Button1Down)',
              'state.start()',
              'findToolByName("Combat")',
              'while autoBoxingEnabled do',
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit("missing: " + ", ".join(missing))

      - name: Commit feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AseholeHub.lua
          git commit -m "feat: combine auto boxing and game M1"
          git push
