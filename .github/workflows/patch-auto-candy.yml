name: Patch Auto Candy v1.3.1

on:
  push:
    paths:
      - '.github/workflows/patch-auto-candy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch AseholeHub.lua
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('AseholeHub.lua')
          s = p.read_text(encoding='utf-8')

          assert 'local HUB_VERSION = "1.3.0"' in s
          s = s.replace('-- ASEHOLE HUB v1.3.0', '-- ASEHOLE HUB v1.3.1', 1)
          s = s.replace('local HUB_VERSION = "1.3.0"', 'local HUB_VERSION = "1.3.1"', 1)

          old_constants = '''local CANDY_PURCHASE_BATCH_SIZE = 5
          local CANDY_PURCHASE_DELAY = 0.08
          local CANDY_PURCHASE_CONFIRM_TIMEOUT = 3
          local CANDY_EAT_CONFIRM_TIMEOUT = 3
          local MAX_CANDY_CONFIRM_FAILURES = 3'''
          new_constants = '''local CANDY_PURCHASE_BATCH_SIZE = 5
          local CANDY_PURCHASE_CONFIRM_TIMEOUT = 3
          local CANDY_EAT_CONFIRM_TIMEOUT = 3
          local CANDY_EAT_POLL_DELAY = 0.02
          local MAX_CANDY_CONFIRM_FAILURES = 3'''
          assert old_constants in s
          s = s.replace(old_constants, new_constants, 1)

          old_state = '''local autoCandyInProgress = false
          local candyVendingSignal = nil
          local AutoCandyStatusText = "OFF"'''
          new_state = '''local autoCandyInProgress = false
          local candyPurchaseCallback = nil
          local AutoCandyStatusText = "OFF"'''
          assert old_state in s
          s = s.replace(old_state, new_state, 1)

          start = s.index('local function tryCaptureCandyVendingSignal()')
          end = s.index('\nlocal function waitForCandyIncrease', start)
          new_capture = '''local function tryCaptureCandyPurchaseCallback()
              if candyPurchaseCallback then
                  return true
              end

              if not getconnections then
                  AutoCandyStatusText = "getconnections unsupported"
                  return false
              end

              local option = getCandyVendingOption()

              if not option then
                  AutoCandyStatusText = "Open vending once to capture"
                  return false
              end

              local success, connections = pcall(getconnections, option.MouseButton2Click)

              if not success or not connections then
                  AutoCandyStatusText = "Could not inspect vending button"
                  return false
              end

              for _, connection in ipairs(connections) do
                  local func = connection.Function or connection.Callback

                  if typeof(func) == "function" then
                      local upvalues = getFunctionUpvalues(func)
                      local hasCandyStock = false

                      if upvalues then
                          for _, value in pairs(upvalues) do
                              if typeof(value) == "Instance"
                                  and value:IsA("NumberValue")
                                  and value.Name == "Candy"
                              then
                                  hasCandyStock = true
                                  break
                              end
                          end
                      end

                      if hasCandyStock then
                          candyPurchaseCallback = func
                          AutoCandyStatusText = "Buy-5 callback captured"
                          return true
                      end
                  end
              end

              AutoCandyStatusText = "Candy buy callback not found"
              return false
          end

          local function fireCandyPurchaseBatch()
              if not candyPurchaseCallback then
                  return false, "callback missing"
              end

              return pcall(function()
                  candyPurchaseCallback()
              end)
          end
          '''
          s = s[:start] + new_capture + s[end:]

          old_poll = '''        task.wait(0.1)

                  local current = getCandyQuantity()
                  if current < beforeQuantity then'''
          new_poll = '''        task.wait(CANDY_EAT_POLL_DELAY)

                  local current = getCandyQuantity()
                  if current < beforeQuantity then'''
          assert old_poll in s
          s = s.replace(old_poll, new_poll, 1)

          start = s.index('local function buyCandyBatch()')
          end = s.index('\nlocal function finishCandyEatSession', start)
          new_buy = '''local function buyCandyBatch()
              if not candyPurchaseCallback and not tryCaptureCandyPurchaseCallback() then
                  return false
              end

              local before = getCandyQuantity()

              AutoCandyStatusText =
                  "Buying 5 | "
                  .. tostring(before)
                  .. "/"
                  .. tostring(AUTO_CANDY_TARGET_QUANTITY)

              local success, err = fireCandyPurchaseBatch()

              if not success then
                  AutoCandyStatusText = "Buy-5 callback failed"
                  warn("[Asehole hub] Candy buy callback error:", err)
                  return false
              end

              AutoCandyStatusText = "Waiting for +5 confirmation"

              local confirmed, result = waitForCandyIncrease(
                  before,
                  CANDY_PURCHASE_CONFIRM_TIMEOUT
              )

              if confirmed then
                  AutoCandyStatusText =
                      "Bought 5 Candy | "
                      .. tostring(result)
                      .. "/"
                      .. tostring(AUTO_CANDY_TARGET_QUANTITY)
                  return true
              end

              if result == "fatigue" then
                  AutoCandyStatusText = "Waiting for fatigue recovery"
              else
                  local gained = math.max(0, (tonumber(result) or before) - before)
                  AutoCandyStatusText =
                      "Expected +5, got +"
                      .. tostring(gained)
              end

              return false
          end
          '''
          s = s[:start] + new_buy + s[end:]

          start = s.index('local function eatAllCandy()')
          end = s.index('\nlocal function startAutoCandyWorker', start)
          block = s[start:end]
          old_delay = '''            AutoCandyStatusText = "Candy confirmed | " .. tostring(result) .. " left"
                      task.wait(0.15)'''
          new_delay = '''            AutoCandyStatusText = "Candy confirmed | " .. tostring(result) .. " left"'''
          assert old_delay in block
          block = block.replace(old_delay, new_delay, 1)
          s = s[:start] + block + s[end:]

          old_worker = '''            if not candyVendingSignal then
                          if not tryCaptureCandyVendingSignal() then'''
          new_worker = '''            if not candyPurchaseCallback then
                          if not tryCaptureCandyPurchaseCallback() then'''
          assert old_worker in s
          s = s.replace(old_worker, new_worker, 1)

          old_recapture = '''            if autoCandyEnabled and not candyVendingSignal then
                          tryCaptureCandyVendingSignal()'''
          new_recapture = '''            if autoCandyEnabled and not candyPurchaseCallback then
                          tryCaptureCandyPurchaseCallback()'''
          assert old_recapture in s
          s = s.replace(old_recapture, new_recapture, 1)

          old_debug = 'print("Candy Signal Captured:", candyVendingSignal ~= nil)'
          new_debug = 'print("Candy Buy-5 Callback Captured:", candyPurchaseCallback ~= nil)'
          assert old_debug in s
          s = s.replace(old_debug, new_debug, 1)

          assert 'candyVendingSignal' not in s
          assert 'fireCandyPurchaseOnce' not in s
          assert 'CANDY_PURCHASE_DELAY' not in s
          assert 'local CANDY_EAT_POLL_DELAY = 0.02' in s
          assert 'candyPurchaseCallback()' in s

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AseholeHub.lua
          git diff --cached --check
          git commit -m "Fix Auto Candy batch purchase and eating speed"
          git push origin HEAD:${GITHUB_REF_NAME}
