name: Patch Auto Candy v1.3.2

on:
  push:
    paths:
      - .github/workflows/patch-auto-candy-v132.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch hub
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('AseholeHub.lua')
          s = p.read_text(encoding='utf-8')
          assert 'local HUB_VERSION = "1.3.1"' in s
          s = s.replace('-- ASEHOLE HUB v1.3.1', '-- ASEHOLE HUB v1.3.2', 1)
          s = s.replace('local HUB_VERSION = "1.3.1"', 'local HUB_VERSION = "1.3.2"', 1)
          marker = '    for _, connection in ipairs(connections) do\n'
          anchor = '    if not success or not connections then\n        AutoCandyStatusText = "Could not inspect vending button"\n        return false\n    end\n\n'
          fallback = '    local upvalueGetter = getupvalues or (debug and debug.getupvalues)\n\n    -- Compatibility fallback for executors that expose the connected\n    -- function but do not implement getupvalues/debug.getupvalues.\n    if not upvalueGetter and #connections == 1 then\n        local connection = connections[1]\n        local func = connection.Function or connection.Callback\n\n        if typeof(func) == "function" then\n            candyPurchaseCallback = func\n            AutoCandyStatusText = "Buy-5 callback captured (compat)"\n            return true\n        end\n    end\n\n'
          start = s.index('local function tryCaptureCandyPurchaseCallback()')
          pos = s.index(anchor, start) + len(anchor)
          next_pos = s.index(marker, pos)
          assert next_pos == pos, 'unexpected capture function layout'
          s = s[:pos] + fallback + s[pos:]
          assert 'if not upvalueGetter and #connections == 1 then' in s
          assert 'Buy-5 callback captured (compat)' in s
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AseholeHub.lua
          git commit -m "Add Auto Candy executor compatibility fallback"
          git push
