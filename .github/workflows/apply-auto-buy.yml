name: Apply Auto Buy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-auto-buy.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch AseholeHub.lua
        shell: python
        run: |
          from pathlib import Path
          import base64

          path = Path("AseholeHub.lua")
          source = path.read_text(encoding="utf-8")

          if 'local HUB_VERSION = "1.3.6"' in source and 'Name = "Auto Buy Continuous"' in source:
              print("Auto Buy already applied; nothing to do.")
              raise SystemExit(0)

          def replace_once(old, new, label):
              global source
              if old not in source:
                  raise SystemExit(f"Missing patch anchor: {label}")
              source = source.replace(old, new, 1)

          def decode(value):
              return base64.b64decode(value).decode("utf-8")

          replace_once("-- ASEHOLE HUB v1.3.5", "-- ASEHOLE HUB v1.3.6", "version header")
          replace_once('local HUB_VERSION = "1.3.5"', 'local HUB_VERSION = "1.3.6"', "HUB_VERSION")
          replace_once('local DEFAULT_TOOL_NAME = "Boxing Gloves"\n', 'local DEFAULT_TOOL_NAME = "Boxing Gloves"\nlocal AUTO_BUY_INTERVAL = 0.25\n', "auto buy interval")

          state = decode("")
          replace_once("local autoUseThread = nil\n", state, "Auto Use state")

          auto_buy_logic = decode("")

          # Correct full payload (kept separate so malformed/truncated decode above cannot be used accidentally).
          auto_buy_logic = decode("")

          # Build the complete logic from a compact literal to avoid YAML indentation hazards.
          auto_buy_logic = """-- ============================================================\n-- AUTO BUY\n-- ============================================================\n\nlocal function findNearestPurchaseClickDetector(itemName)\n    local map = workspace:FindFirstChild(\"Map\")\n    local character = player.Character\n    local root = character and character:FindFirstChild(\"HumanoidRootPart\")\n    if not map or not root then return nil end\n    local wanted = normalizeName(trim(itemName or \"\"))\n    if wanted == \"\" then return nil end\n    local nearestDetector = nil\n    local nearestDistance = math.huge\n    for _, obj in ipairs(map:GetDescendants()) do\n        if normalizeName(obj.Name) == wanted then\n            local detector = obj:FindFirstChildWhichIsA(\"ClickDetector\", true)\n            if detector then\n                local position = nil\n                local detectorParent = detector.Parent\n                if detectorParent and detectorParent:IsA(\"BasePart\") then\n                    position = detectorParent.Position\n                elseif obj:IsA(\"BasePart\") then\n                    position = obj.Position\n                elseif obj:IsA(\"Model\") then\n                    local ok, pivot = pcall(function() return obj:GetPivot() end)\n                    if ok and pivot then position = pivot.Position end\n                else\n                    local part = obj:FindFirstChildWhichIsA(\"BasePart\", true)\n                    position = part and part.Position or nil\n                end\n                if position then\n                    local distance = (position - root.Position).Magnitude\n                    if distance < nearestDistance then\n                        nearestDistance = distance\n                        nearestDetector = detector\n                    end\n                end\n            end\n        end\n    end\n    return nearestDetector\nend\n\nlocal function buyNearestItemOnce()\n    if type(fireclickdetector) ~= \"function\" then return false end\n    local detector = findNearestPurchaseClickDetector(buyItemName)\n    if not detector then return false end\n    return pcall(function() fireclickdetector(detector) end)\nend\n\nlocal function startAutoBuyContinuous()\n    if autoBuyContinuousThread then return end\n    autoBuyContinuousThread = task.spawn(function()\n        while autoBuyContinuousEnabled do\n            if canRunAutomation() then\n                buyNearestItemOnce()\n            end\n            task.wait(AUTO_BUY_INTERVAL)\n        end\n        autoBuyContinuousThread = nil\n    end)\nend\n\nlocal function stopAutoBuyContinuous()\n    autoBuyContinuousEnabled = false\nend\n\nlocal function startAutoBuyOnce()\n    if autoBuyOnceThread then return end\n    autoBuyOnceThread = task.spawn(function()\n        while autoBuyOnceEnabled do\n            if canRunAutomation() then\n                local purchased = buyNearestItemOnce()\n                if purchased then\n                    autoBuyOnceEnabled = false\n                    if AutoBuyOnceToggle then AutoBuyOnceToggle:Set(false) end\n                    break\n                end\n            end\n            task.wait(AUTO_BUY_INTERVAL)\n        end\n        autoBuyOnceThread = nil\n    end)\nend\n\n"""

          anti_afk_marker = "-- ============================================================\n-- ANTI AFK\n-- ============================================================\n"
          replace_once(anti_afk_marker, auto_buy_logic + anti_afk_marker, "Auto Buy logic insertion")

          auto_buy_ui = decode("")
          prompt_ui_marker = "-- ============================================================\n-- PROMPT UI\n-- ============================================================\n"
          replace_once(prompt_ui_marker, auto_buy_ui + prompt_ui_marker, "Auto Buy UI insertion")

          path.write_text(source, encoding="utf-8")
          print("Patched AseholeHub.lua for v1.3.6 Auto Buy.")

      - name: Commit Auto Buy
        shell: bash
        run: |
          if git diff --quiet -- AseholeHub.lua; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AseholeHub.lua
          git commit -m "feat: add Auto Buy controls"
          git push origin HEAD:main
