name: Patch Account Reporter v1.3.4

on:
  push:
    paths:
      - '.github/workflows/patch-account-reporter-v134.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch account reporter
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          p = Path('AseholeHub.lua')
          s = p.read_text(encoding='utf-8')

          assert '-- ASEHOLE HUB v1.3.3' in s
          assert 'local HUB_VERSION = "1.3.3"' in s
          assert 'local ACCOUNT_REPORT_INTERVAL = 3600' not in s

          s = s.replace('-- ASEHOLE HUB v1.3.3', '-- ASEHOLE HUB v1.3.4', 1)
          s = s.replace('local HUB_VERSION = "1.3.3"', 'local HUB_VERSION = "1.3.4"', 1)

          constants_anchor = 'local MAX_CANDY_CONFIRM_FAILURES = 3\n\n-- ============================\n-- SERVICES'
          constants_block = base64.b64decode('').decode('utf-8')
          assert constants_anchor in s
          s = s.replace(constants_anchor, constants_block, 1)

          reporter_anchor = 'local function sendDiscordWebhook(alertType)'
          reporter_block = base64.b64decode('').decode('utf-8')
          assert reporter_anchor in s
          s = s.replace(reporter_anchor, reporter_block + reporter_anchor, 1)

          # GREEN regression checks
          assert '-- ASEHOLE HUB v1.3.4' in s
          assert 'local HUB_VERSION = "1.3.4"' in s
          assert 'local ACCOUNT_REPORT_INTERVAL = 3600' in s
          assert '[666134602]' in s and 'Nickname = "token"' in s
          assert '[3725794499]' in s and 'Nickname = "filip"' in s
          assert 'PASTE_TOKEN_WEBHOOK_URL_HERE' in s
          assert 'PASTE_FILIP_WEBHOOK_URL_HERE' in s
          assert 'local function sendAccountStatsSnapshot' in s
          assert 'local fields = buildDiscordStatFields()' in s
          assert 'ACCOUNT_REPORT_TARGETS[player.UserId]' in s
          assert 'while true do\n            sendAccountStatsSnapshot(account)\n            task.wait(ACCOUNT_REPORT_INTERVAL)' in s
          assert 'startAccountStatsReporter()' in s
          assert 'discord.com/api/webhooks/' not in reporter_block

          reporter_start = s.index('-- ACCOUNT REPORTER')
          reporter_end = s.index(reporter_anchor, reporter_start)
          reporter_section = s[reporter_start:reporter_end]
          assert 'WebhookTab' not in reporter_section
          assert 'CreateLabel' not in reporter_section
          assert 'CreateToggle' not in reporter_section
          assert 'CreateButton' not in reporter_section

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify diff
        shell: bash
        run: |
          git diff --check
          grep -q 'local HUB_VERSION = "1.3.4"' AseholeHub.lua
          grep -q 'local ACCOUNT_REPORT_INTERVAL = 3600' AseholeHub.lua
          grep -q 'PASTE_TOKEN_WEBHOOK_URL_HERE' AseholeHub.lua
          grep -q 'PASTE_FILIP_WEBHOOK_URL_HERE' AseholeHub.lua

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AseholeHub.lua
          git diff --cached --check
          git commit -m "Add hourly account stats reporter"
          git push origin HEAD:${GITHUB_REF_NAME}
