name: Apply Boxing Gloves

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-boxing-gloves.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch AseholeHub.lua
        shell: python
        run: |
          from pathlib import Path
          import base64

          path = Path("AseholeHub.lua")
          source = path.read_text(encoding="utf-8")

          def dec(value):
              return base64.b64decode(value).decode("utf-8")

          def replace_once(old, new, label):
              global source
              if old not in source:
                  raise SystemExit(f"Missing patch anchor: {label}")
              source = source.replace(old, new, 1)

          replace_once("-- ASEHOLE HUB v1.3.6", "-- ASEHOLE HUB v1.3.7", "version header")
          replace_once('local HUB_VERSION = "1.3.6"', 'local HUB_VERSION = "1.3.7"', "HUB_VERSION")

          replace_once(
              dec("bG9jYWwgQXV0b0J1eUNvbnRpbnVvdXNUb2dnbGUgPSBuaWwKbG9jYWwgQXV0b0J1eU9uY2VUb2dnbGUgPSBuaWwK"),
              dec("bG9jYWwgQXV0b0J1eUNvbnRpbnVvdXNUb2dnbGUgPSBuaWwKbG9jYWwgQXV0b0J1eU9uY2VUb2dnbGUgPSBuaWwKCi0tIEF1dG8gQnV5IEJveGluZyBHbG92ZXMKbG9jYWwgYXV0b0J1eUJveGluZ0dsb3Zlc0VuYWJsZWQgPSBmYWxzZQpsb2NhbCBhdXRvQnV5Qm94aW5nR2xvdmVzVGhyZWFkID0gbmlsCg=="),
              "boxing gloves state",
          )

          replace_once(
              dec(""),
              dec(""),
              "named purchase helper",
          )

          anti_afk_marker = "-- ============================================================\n-- ANTI AFK\n-- ============================================================\n"
          replace_once(
              anti_afk_marker,
              dec("") + anti_afk_marker,
              "boxing gloves logic",
          )

          ui_anchor = 'AutoUseTab:CreateLabel("Auto Buy uses the nearest matching ClickDetector under workspace.Map.")\n\n'
          replace_once(
              ui_anchor,
              ui_anchor + dec(""),
              "boxing gloves UI",
          )

          path.write_text(source, encoding="utf-8")

      - name: Verify patch structure
        shell: python
        run: |
          from pathlib import Path
          source = Path("AseholeHub.lua").read_text(encoding="utf-8")
          required = [
              'local HUB_VERSION = "1.3.7"',
              'Name = "Auto Buy Boxing Gloves"',
              'Flag = "AutoBuyBoxingGloves"',
              'FindFirstChild("Boxing Gloves")',
              'buyNamedItemOnce("Boxing Gloves")',
              'equipAndActivateTool(glovesTool)',
              'while autoBuyBoxingGlovesEnabled do',
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit("Missing: " + ", ".join(missing))

      - name: Commit feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AseholeHub.lua
          git diff --cached --check
          git commit -m "feat: add auto buy boxing gloves"
          git push
