name: Apply Auto Boxing Cycle Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-auto-boxing-cycle-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch AseholeHub.lua
        shell: python
        run: |
          from pathlib import Path

          path = Path("AseholeHub.lua")
          source = path.read_text(encoding="utf-8")

          source = source.replace("-- ASEHOLE HUB v1.3.8", "-- ASEHOLE HUB v1.3.9", 1)
          source = source.replace('local HUB_VERSION = "1.3.8"', 'local HUB_VERSION = "1.3.9"', 1)

          source = source.replace(
              'local AUTO_BOXING_DEFAULT_M1_PULSE = 0.35\nlocal GAME_M1_SOURCE = "ReplicatedStorage.Modules.Client.Keybinds.functions.m1"',
              'local AUTO_BOXING_DEFAULT_M1_PULSE = 0.35\nlocal AUTO_BOXING_M1_HOLD_DURATION = 0.35\nlocal GAME_M1_SOURCE = "ReplicatedStorage.Modules.Client.Keybinds.functions.m1"',
              1,
          )

          source = source.replace(
              "local autoBoxingM1Pulse = AUTO_BOXING_DEFAULT_M1_PULSE\nlocal autoBoxingM1State = nil",
              "local autoBoxingM1Pulse = AUTO_BOXING_DEFAULT_M1_PULSE\nlocal autoBoxingM1State = nil\nlocal autoBoxingPulseGeneration = 0",
              1,
          )

          pulse_start = source.index("local function pulseGameM1()")
          worker_start = source.index("local function startAutoBoxing()", pulse_start)

          new_pulse = '''local function pulseGameM1()
              local state = autoBoxingM1State

              if type(state) ~= "table"
                  or type(state.hold) ~= "boolean"
                  or type(state.start) ~= "function"
              then
                  state = findGameM1State()
                  autoBoxingM1State = state
              end

              if not state then
                  return false
              end

              autoBoxingPulseGeneration += 1
              local thisPulse = autoBoxingPulseGeneration

              state.hold = true

              task.spawn(function()
                  pcall(function()
                      state.start()
                  end)
              end)

              task.wait(AUTO_BOXING_M1_HOLD_DURATION)

              if thisPulse == autoBoxingPulseGeneration then
                  state.hold = false
              end

              return true
          end'''

          source = source[:pulse_start] + new_pulse + "\n\n" + source[worker_start:]

          worker_start = source.index("local function startAutoBoxing()")
          anti_afk_start = source.index("-- ============================================================\n-- ANTI AFK", worker_start)

          new_worker = '''local function startAutoBoxing()
              if autoBoxingThread then
                  return
              end

              autoBoxingThread = task.spawn(function()
                  while autoBoxingEnabled do
                      local usedPunchInterval = false

                      if canRunAutomation() then
                          if not hasActiveBoxingGloves() then
                              ensureBoxingGlovesActive()
                          else
                              local combatTool = findToolByName("Combat")

                              if combatTool and equipToolOnly(combatTool) then
                                  local punchStartedAt = os.clock()

                                  if pulseGameM1() then
                                      local elapsed = os.clock() - punchStartedAt
                                      local remaining = autoBoxingM1Pulse - elapsed

                                      if remaining > 0 then
                                          task.wait(remaining)
                                      end

                                      usedPunchInterval = true
                                  end
                              end
                          end
                      end

                      if not usedPunchInterval then
                          task.wait(AUTO_BUY_INTERVAL)
                      end
                  end

                  autoBoxingPulseGeneration += 1

                  if autoBoxingM1State then
                      autoBoxingM1State.hold = false
                  end

                  autoBoxingM1State = nil
                  autoBoxingThread = nil
              end)
          end

          local function stopAutoBoxing()
              autoBoxingEnabled = false
              autoBoxingPulseGeneration += 1

              if autoBoxingM1State then
                  autoBoxingM1State.hold = false
              end

              autoBoxingM1State = nil
          end

          player.CharacterAdded:Connect(function()
              autoBoxingPulseGeneration += 1

              if autoBoxingM1State then
                  pcall(function()
                      autoBoxingM1State.hold = false
                  end)
              end

              autoBoxingM1State = nil
          end)'''

          source = source[:worker_start] + new_worker + "\n\n" + source[anti_afk_start:]

          slider_start = source.index('AutoUseTab:CreateSlider({\n    Name = "M1 Pulse"')
          label_start = source.index('AutoUseTab:CreateLabel("Auto Boxing keeps Boxing Gloves active', slider_start)

          new_slider = '''AutoUseTab:CreateSlider({
              Name = "M1 Pulse",
              Range = {0.35, 1.5},
              Increment = 0.01,
              Suffix = "s",
              CurrentValue = 0.35,
              Flag = "AutoBoxingM1Pulse",
              Callback = function(value)
                  autoBoxingM1Pulse = math.clamp(
                      tonumber(value) or AUTO_BOXING_DEFAULT_M1_PULSE,
                      0.35,
                      1.5
                  )
              end,
          })

          '''

          source = source[:slider_start] + new_slider + source[label_start:]

          source = source.replace(
              "AutoUseTab:CreateLabel(\"Auto Boxing keeps Boxing Gloves active, equips Combat, and uses the game's M1 function.\")",
              "AutoUseTab:CreateLabel(\"Auto Boxing keeps Boxing Gloves active, equips Combat, and uses the game's M1 function.\")\nAutoUseTab:CreateLabel(\"M1 hold stays fixed at 0.35s; M1 Pulse controls time between punch starts.\")",
              1,
          )

          path.write_text(source, encoding="utf-8")

      - name: Verify patch structure
        shell: python
        run: |
          from pathlib import Path

          source = Path("AseholeHub.lua").read_text(encoding="utf-8")
          checks = [
              'local HUB_VERSION = "1.3.9"',
              'local AUTO_BOXING_M1_HOLD_DURATION = 0.35',
              'local autoBoxingPulseGeneration = 0',
              'task.wait(AUTO_BOXING_M1_HOLD_DURATION)',
              'local remaining = autoBoxingM1Pulse - elapsed',
              'Range = {0.35, 1.5}',
          ]
          missing = [needle for needle in checks if needle not in source]
          if missing:
              raise SystemExit("Missing patch checks: " + repr(missing))

      - name: Commit feature
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AseholeHub.lua
          git commit -m "fix: use tested auto boxing M1 cycle"
          git push
