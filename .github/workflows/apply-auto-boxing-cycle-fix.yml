name: Apply Auto Boxing Cycle Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-auto-boxing-cycle-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch AseholeHub.lua
        shell: bash
        run: |
          echo '~= ' | base64 -d > /tmp/patch_auto_boxing.py
          python /tmp/patch_auto_boxing.py

      - name: Verify patch structure
        shell: python
        run: |
          from pathlib import Path
          source = Path("AseholeHub.lua").read_text(encoding="utf-8")
          checks = [
              'local HUB_VERSION = "1.3.9"',
              'local AUTO_BOXING_M1_HOLD_DURATION = 0.35',
              'local autoBoxingPulseGeneration = 0',
              'task.wait(AUTO_BOXING_M1_HOLD_DURATION)',
              'local remaining = autoBoxingM1Pulse - elapsed',
              'Range = {0.35, 1.5}',
          ]
          missing = [x for x in checks if x not in source]
          if missing:
              raise SystemExit("Missing: " + repr(missing))

      - name: Commit feature
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AseholeHub.lua
          git commit -m "fix: use tested auto boxing M1 cycle"
          git push
