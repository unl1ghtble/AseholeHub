name: Boxing Gloves Regression

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  boxing-gloves-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Auto Buy Boxing Gloves structure
        shell: python
        run: |
          from pathlib import Path

          source = Path("AseholeHub.lua").read_text(encoding="utf-8")

          checks = {
              "version bumped to 1.3.7": 'local HUB_VERSION = "1.3.7"' in source,
              "boxing gloves toggle": 'Name = "Auto Buy Boxing Gloves"' in source and 'Flag = "AutoBuyBoxingGloves"' in source,
              "active folder detection": 'FindFirstChild("Boxing Gloves")' in source and 'IsA("Folder")' in source,
              "owned tool reuse": 'findToolByName("Boxing Gloves")' in source,
              "auto activation": 'equipAndActivateTool(glovesTool)' in source,
              "specific purchase": 'buyNamedItemOnce("Boxing Gloves")' in source,
              "continuous worker": 'while autoBuyBoxingGlovesEnabled do' in source,
              "automation priority respected": 'if canRunAutomation() then' in source,
          }

          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(("PASS" if ok else "FAIL") + ": " + name)

          if failed:
              raise SystemExit("Missing Boxing Gloves requirements: " + ", ".join(failed))
